---
name: Uptime Kuma Local
version: dev
slug: uptime
description: It is a self-hosted monitoring tool like "Uptime Robot"
url: https://github.com/hassio-addons/app-uptime-kuma
webui: http://[HOST]:[PORT:3001]
init: false
arch:
  - aarch64
  - amd64
ports:
  3001/tcp: 3001
watchdog: "http://[HOST]:[PORT:3001]"
host_network: true
startup: application
boot: auto
environment:
  UPTIME_KUMA_DISABLE_FRAME_SAMEORIGIN: "true"
  DOCKER_TLS_DIR_PATH: "/data/docker-tls"
  NODE_EXTRA_CA_CERTS: "/data/docker-tls/fullchain.pem"
map:
  - ssl:ro
hassio_api: true
hassio_role: admin
docker_api: true
ports_description:
  3001/tcp: Web interface
discovery:
  - uptime_kuma
