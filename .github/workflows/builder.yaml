name: Build and Sync Custom Add-on

on:
  schedule:
    - cron: '0 0 * * *' # Runs once every day at midnight to scan for upstream updates
  workflow_dispatch: # Allows you to manually click "Run workflow" in GitHub UI anytime

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: 📂 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🔍 Fetch Latest Upstream Stable Release Tag
        id: upstream_version
        run: |
          # Query GitHub API for the latest stable tag on Frenck's repo
          UPSTREAM_TAG=$(curl -s "https://github.com" | jq -r '.tag_name')
          
          if [ "$UPSTREAM_TAG" == "null" ] || [ -z "$UPSTREAM_TAG" ]; then
            echo "Error fetching upstream release data."
            exit 1
          fi
          
          echo "Latest Upstream Version Found: $UPSTREAM_TAG"
          echo "version=$UPSTREAM_TAG" >> $GITHUB_OUTPUT

      - name: 🏷️ Compare Against Cached Version Tag
        id: check_update
        run: |
          # Read local track file if it exists, otherwise treat as brand new build
          LOCAL_VERSION_FILE=".upstream_version_cache"
          LOCAL_TAG=""
          if [ -f "$LOCAL_VERSION_FILE" ]; then
            LOCAL_TAG=$(cat "$LOCAL_VERSION_FILE")
          fi
          
          UPSTREAM_TAG="${{ steps.upstream_version.outputs.version }}"
          
          if [ "$LOCAL_TAG" == "$UPSTREAM_TAG" ]; then
            echo "No new stable deployment found upstream ($UPSTREAM_TAG). Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "New upstream stable deployment found ($UPSTREAM_TAG)! Starting build..."
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

      - name: 🔧 Set up QEMU (For Multi-Arch Support)
        if: steps.check_update.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: 🐳 Set up Docker Buildx
        if: steps.check_update.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to GitHub Container Registry
        if: steps.check_update.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Build and Push Add-on Image
        if: steps.check_update.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./uptime-kuma   # Point this to where your Dockerfile lives
          platforms: linux/amd64,linux/arm64
          push: false #Temporary
          tags: |
            ghcr.io/${{ github.repository_owner }}/uptime-kuma-docsock:latest
            ghcr.io/${{ github.repository_owner }}/uptime-kuma-docsock:${{ steps.upstream_version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 💾 Update Local Version Cache File
        if: steps.check_update.outputs.should_build == 'true'
        run: |
          # Save the newly built version tag so the next cron run knows it's processed
          UPSTREAM_TAG="${{ steps.upstream_version.outputs.version }}"
          echo "$UPSTREAM_TAG" > .upstream_version_cache
          
          # Commit the tracker file back to your repo to persist the check state
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41182845+github-actions[bot]@users.noreply.github.com"
          git add .upstream_version_cache
          git commit -m "chore: Sync upstream tag reference to $UPSTREAM_TAG [skip ci]"
          git push

      - name: 📢 Force Home Assistant Add-on Config Version Bump
        if: steps.check_update.outputs.should_build == 'true'
        run: |
          # Use yq or sed to quickly rewrite the version string in your config.yaml
          # This forces your Home Assistant instance to see the "Update" button!
          UPSTREAM_TAG="${{ steps.upstream_version.outputs.version }}"
          sed -i "s/^version:.*/version: \"$UPSTREAM_TAG\"/" ./uptime-kuma/config.yaml
          
          git add ./uptime-kuma/config.yaml
          git commit -m "bump: Version updated to match upstream stable $UPSTREAM_TAG"
          #Temporary git push

